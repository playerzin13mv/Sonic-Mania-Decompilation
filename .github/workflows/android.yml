name: Android Release
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aplicar mudanças D.T
        run: ./scripts/apply_dt.sh
      - name: Build
        working-directory: dependencies/RSDKv5/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PRETRO_DISABLE_PLUS=true -PABIFILTERS="arm64-v8a;armeabi-v7a"
      - name: Assinar
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find dependencies/RSDKv5/android -path "*outputs/apk/release*" -name "*.apk" | head -1)
          $BT/zipalign -f -p 4 "$APK" aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out SonicManiaDT.apk aligned.apk
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: SonicManiaDT
          path: SonicManiaDT.apk
